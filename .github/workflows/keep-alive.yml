name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SB_URL: ${{ vars.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "::warning::Configure SUPABASE_URL (vars) e SUPABASE_ANON_KEY (secrets) para o keep-alive funcionar."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            "$SB_URL/rest/v1/fitapp_config?select=chave&limit=1")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Supabase respondeu HTTP $code (projeto pode estar pausado)"
            exit 1
          fi