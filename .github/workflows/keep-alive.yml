name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SB_URL: https://cqvjnvncsozjypwthniu.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          KEY="${SB_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxcmpudm5jc296anlwd3Robml1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ4Nzg1MzAsImV4cCI6MjA3MDQ1NDUzMH0.q2KJbFs9mgEPWtZ0DlS0w7x5LLvBnEBO5YoyYTBnRkA}"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$SB_URL/rest/v1/deleon_config?select=chave&limit=1")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Supabase respondeu HTTP $code (projeto pode estar pausado)"
            exit 1
          fi
